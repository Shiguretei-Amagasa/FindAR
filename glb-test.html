<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB単体表示テスト(FindAR_v8: 1回再生 → ループ)</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin:0;">

<div id="info" style="position:fixed; top:8px; left:8px; right:8px; z-index:600; color:#fff; background:rgba(0,0,0,0.6); padding:6px 10px; font-family:sans-serif; font-size:13px; border-radius:6px; line-height:1.5;">
  読み込み中...
</div>

<a-scene background="color: #222">
  <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
  <a-light type="directional" color="#ffffff" intensity="1" position="1 1 1"></a-light>

  <!-- 1ファイル(0〜90f)。前半は1回だけ、LOOP_START〜LOOP_END をループ再生する -->
  <a-entity id="holo" gltf-model="url(./FindAR_v8.glb)" position="0 0 -5"></a-entity>

  <a-camera position="0 1.6 0"></a-camera>
</a-scene>

<script>
  // ════════════════════════════════════════════════
  // 設定(URLパラメータで上書き可能)
  //   ?loop=30   ループ開始フレーム(既定 30)  ← 後から調整するのはここ
  //   ?end=90    ループ終了フレーム(既定 90)
  //   ?fps=24    GLBのフレームレート(既定 24)
  //   ?ry=90     Y軸まわりの回転角(度)。向きが逆なら -90
  //   ?mat=1     1(既定): 透過表現(transmission)だけ無効化 / 2: 1+深度書き込み / 3: 診断用の全不透明化
  //   ?src=...   読み込むGLBのパス(既定 ./FindAR_v8.glb)
  //   例) ...glb-test-v8.html?loop=28&end=90
  // 画面をタップすると、最初(0f)から再生し直します。
  // ════════════════════════════════════════════════
  const params = new URLSearchParams(location.search);
  const num = (key, def) => (params.has(key) ? parseFloat(params.get(key)) : def);

  const FPS = num('fps', 24);
  const LOOP_START_F = num('loop', 30);
  const LOOP_END_F = num('end', 90);
  const RY = num('ry', 90);
  const MAT_MODE = params.get('mat') || '1';
  const SRC = params.get('src') || './FindAR_v8.glb';

  const infoEl = document.getElementById('info');
  const holoEl = document.getElementById('holo');

  holoEl.setAttribute('gltf-model', `url(${SRC})`);
  holoEl.setAttribute('rotation', `0 ${RY} 0`);

  let mixer = null;
  let loopStart = LOOP_START_F / FPS;  // 秒
  let loopEnd = LOOP_END_F / FPS;      // 秒(モデルの実長より長ければ後で切り詰める)
  let startMs = null;
  let ready = false;
  let actions = [];   // { a: AnimationAction, d: クリップ長(秒), name, start(秒) }
  let groups = [];    // 同じノード・同じプロパティを動かしてしまう「重複クリップ」の組(開始が早い順)
  let modelRef = null;
  let frameNo = 0;
  let diag = '';

  // 重複クリップの扱い: three.js は同じプロパティに複数クリップが当たると 50:50 で「平均」してしまう。
  // それを避けるため、各組では「その時刻までに開始した最後のクリップ」だけを有効(重み1)にし、他は重み0にする。
  // 例) 球Action(1〜59f) と 球Action.003(30〜88f) → 30f未満は球Action、30f以降は球Action.003のみ
  function buildGroups(clips) {
    const byKey = new Map();
    actions.forEach((x, i) => {
      const clip = clips[i];
      let start = Infinity;
      clip.tracks.forEach((tr) => { start = Math.min(start, tr.times[0]); });
      x.start = start;
      x.name = clip.name;
      const key = clip.tracks.map((tr) => tr.name).sort().join('|');
      if (!byKey.has(key)) byKey.set(key, []);
      byKey.get(key).push(x);
    });
    groups = [...byKey.values()].filter((g) => g.length > 1).map((g) => g.sort((a, b) => a.start - b.start));
    groups.forEach((g) => console.log('[重複クリップ] 同じプロパティを動かす組:',
      g.map((x) => `${x.name}(開始${(x.start * FPS).toFixed(0)}f)`).join(' → '), '… 開始の遅いものが始まったら切り替え'));
    if (groups.length === 0) console.log('[重複クリップ] なし');
  }

  // 再生位置を直接指定する。クリップごとに最終キーで止める(それ以降は最後の値を保つ)。
  // ※ LoopOnce+clampWhenFinished は使わない: 終了したactionが「一時停止」状態になり、
  //   その後 setTime しても 0f の姿勢に固定されてしまう(モデルが消える原因になる)
  function chainVisible(o) {
    for (; o; o = o.parent) if (!o.visible) return false;
    return true;
  }

  function seek(t) {
    actions.forEach(({ a, d }) => { a.time = Math.min(t, d - 0.0001); });
    groups.forEach((g) => {
      let active = g[0];
      g.forEach((x) => { if (x.start <= t + 0.0001) active = x; });
      g.forEach((x) => x.a.setEffectiveWeight(x === active ? 1 : 0));
    });
    mixer.update(0);
  }

  // 経過秒 → 再生位置(秒)。前半は1回だけ、ループ開始以降は [loopStart, loopEnd) を繰り返す
  function timeAt(elapsed) {
    if (elapsed < loopStart) return elapsed;
    return loopStart + ((elapsed - loopStart) % (loopEnd - loopStart));
  }

  // 全クリップのキー範囲(秒)
  function overallRange(clips) {
    let lo = Infinity, hi = -Infinity;
    clips.forEach((clip) => clip.tracks.forEach((tr) => {
      lo = Math.min(lo, tr.times[0]);
      hi = Math.max(hi, tr.times[tr.times.length - 1]);
    }));
    return [lo, hi];
  }

  // 診断: ループ開始時と終了時で、位置・回転・スケールがどれだけ違うかを調べる
  // (大きな差があると、ループの折り返しで「パッと飛ぶ」ように見える)
  function snapshot(model, t) {
    seek(t);
    model.updateMatrixWorld(true);
    const snap = new Map();
    model.traverse((o) => {
      snap.set(o, { p: o.position.clone(), q: o.quaternion.clone(), s: o.scale.clone() });
    });
    return snap;
  }
  function diagnoseSeam(model) {
    const a = snapshot(model, loopStart);
    const b = snapshot(model, loopEnd);
    const rows = [];
    a.forEach((va, obj) => {
      const vb = b.get(obj);
      const dp = va.p.distanceTo(vb.p);
      const dq = 1 - Math.abs(va.q.dot(vb.q));   // 0 なら同じ向き
      const ds = va.s.distanceTo(vb.s);
      if (dp > 0.001 || dq > 0.0001 || ds > 0.001) {
        rows.push(`${obj.name || obj.type}: 位置差=${dp.toFixed(4)} 回転差=${dq.toFixed(5)} スケール差=${ds.toFixed(4)}`);
      }
    });
    if (rows.length === 0) {
      console.log(`[SEAM] ${LOOP_START_F}f と ${(loopEnd * FPS).toFixed(0)}f の姿勢は一致(位置・回転・スケール)`);
    } else {
      console.warn(`[SEAM] ${LOOP_START_F}f と ${(loopEnd * FPS).toFixed(0)}f で姿勢が違うオブジェクト(ループの継ぎ目で飛ぶ原因):\n` + rows.join('\n'));
    }
    seek(0);
  }

  function prepare(model) {
    // ── 材質の調整(元のalphaを保ち、透過表現(transmission)だけ無効化) ──
    // 1018版と同じ: alpha が実質0のメッシュは非表示にする
    let hiddenByAlpha = 0;
    model.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      mats.forEach((mat) => {
        mat.transmission = 0;
        if (MAT_MODE === '2') mat.depthWrite = true;
        if (MAT_MODE === '3') { mat.transparent = false; mat.opacity = 1; mat.depthWrite = true; }
        mat.needsUpdate = true;
        if (MAT_MODE !== '3' && mat.opacity <= 0.001) {
          // node.visible=false にすると、子ノード(Target_All の cell 破片244個)まで描画されなくなる。
          // そのため、このメッシュ自身だけを隠す(マテリアルを不可視にする)
          mat.visible = false; hiddenByAlpha++;
          console.log(`[alpha=0] このメッシュだけ非表示: ${node.name} (子ノード数 ${node.children.length})`);
        }
      });
    });
    console.log(`[model] alpha=0で非表示にしたマテリアル数: ${hiddenByAlpha}`);

    const clips = model.animations || [];
    if (clips.length === 0) { infoEl.textContent = 'アニメーションが見つかりません'; return; }

    // 全クリップを同じミキサーで再生(別オブジェクトを動かすクリップが複数あっても同時に進む)。
    // 時刻は seek() が毎フレーム直接指定する(短いクリップは最終キーで止まる)
    mixer = new THREE.AnimationMixer(model);
    actions = clips.map((clip) => {
      const a = mixer.clipAction(clip);
      a.play();
      return { a, d: clip.duration };
    });
    modelRef = model;
    buildGroups(clips);

    const [lo, hi] = overallRange(clips);
    if (loopEnd > hi + 0.0001) {
      console.warn(`[loop] 指定の終了 ${LOOP_END_F}f がモデルの最終キー ${(hi * FPS).toFixed(1)}f より後です。最終キーに切り詰めます`);
      loopEnd = hi;
    }
    if (loopEnd - loopStart <= 0.0001) {
      infoEl.textContent = `ループ区間が不正です (${LOOP_START_F}f〜${(loopEnd * FPS).toFixed(1)}f)`;
      return;
    }

    console.log('[clips]', clips.map((c) => {
      let a = Infinity, b = -Infinity;
      c.tracks.forEach((tr) => { a = Math.min(a, tr.times[0]); b = Math.max(b, tr.times[tr.times.length - 1]); });
      return `${c.name}(${(a * FPS).toFixed(0)}〜${(b * FPS).toFixed(0)}f)`;
    }).join(' / '));
    console.log(`[loop] 全体 ${(lo * FPS).toFixed(0)}〜${(hi * FPS).toFixed(0)}f / ループ ${LOOP_START_F}〜${(loopEnd * FPS).toFixed(0)}f / fps=${FPS}`);

    diagnoseSeam(model);

    ready = true;
    startMs = null;
    requestAnimationFrame(tick);
  }

  function tick(nowMs) {
    if (startMs === null) startMs = nowMs;
    const elapsed = (nowMs - startMs) / 1000;
    const t = timeAt(elapsed);
    seek(t);

    const tag = `loop=${LOOP_START_F}〜${(loopEnd * FPS).toFixed(0)}f ry=${RY} mat=${MAT_MODE}`;
    const label = elapsed < loopStart ? '1回再生中' : 'ループ再生中';
    // 診断: いま見えているメッシュ数と全体の大きさ(「何も出ない」のか「画面外」なのかの切り分け用)
    if (frameNo++ % 10 === 0 && modelRef) {
      modelRef.updateMatrixWorld(true);
      let vis = 0, total = 0;
      modelRef.traverse((o) => {
        if (!o.isMesh) return;
        total++;
        const e = o.matrixWorld.elements;
        if (chainVisible(o) && o.material && (Array.isArray(o.material) ? o.material[0].visible : o.material.visible) && Math.hypot(e[0], e[1], e[2]) > 0.001) vis++;
      });
      const box = new THREE.Box3();
      modelRef.traverse((o) => {
        if (o.isMesh && chainVisible(o)) {
          const e = o.matrixWorld.elements;
          if (Math.hypot(e[0], e[1], e[2]) > 0.001) box.expandByObject(o);
        }
      });
      const c = box.getCenter(new THREE.Vector3()), z = box.getSize(new THREE.Vector3());
      diag = vis === 0 ? `見えているメッシュ: 0 / ${total}` :
        `見えているメッシュ: ${vis} / ${total}<br>中心(${c.x.toFixed(1)}, ${c.y.toFixed(1)}, ${c.z.toFixed(1)}) 大きさ(${z.x.toFixed(1)}, ${z.y.toFixed(1)}, ${z.z.toFixed(1)})`;
    }
    infoEl.innerHTML = `${label} / ${(t * FPS).toFixed(1)}f / ${tag}<br>${diag}<br><small>画面タップで最初から</small>`;
    requestAnimationFrame(tick);
  }

  // タップで頭出し
  document.addEventListener('click', () => { if (ready) startMs = null; });

  holoEl.addEventListener('model-loaded', (e) => prepare(e.detail.model));
  holoEl.addEventListener('model-error', (e) => {
    console.error('[model] model-error:', e.detail);
    infoEl.textContent = 'GLBの読み込みに失敗しました(ファイル名・場所を確認)';
  });
</script>
</body>
</html>
