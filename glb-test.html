<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB単体表示テスト(appear → loop)</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin:0;">

<div id="info" style="position:fixed; top:8px; left:8px; right:8px; z-index:600; color:#fff; background:rgba(0,0,0,0.6); padding:6px 10px; font-family:sans-serif; font-size:13px; border-radius:6px; line-height:1.5;">
  読み込み中...
</div>

<a-scene background="color: #222">
  <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
  <a-light type="directional" color="#ffffff" intensity="1" position="1 1 1"></a-light>

  <!-- appear(0〜28f・1回再生)と loop(28fから・ループ再生)を、同じ位置に重ねて読み込む -->
  <a-entity id="appear" gltf-model="url(./FindAR_appear.glb)" position="0 0 -5"></a-entity>
  <a-entity id="loop" gltf-model="url(./FindAR_loop.glb)" position="0 0 -5" visible="false"></a-entity>

  <a-camera position="0 1.6 0"></a-camera>
</a-scene>

<script>
  // ════════════════════════════════════════════════
  // 設定(GLBの解析結果に基づく。24fps)
  // ════════════════════════════════════════════════
  const FPS = 24;
  const HANDOFF = 28 / FPS;   // appear は 0〜28f を1回だけ再生し、28f で loop に切り替える
  const EPS = 0.0001;

  // 材質の扱い(URLの ?mat= で切り替え)
  //   mat=1 (既定): 透過(transmission)だけ無効化。元のalphaと半透明ブレンドは保持
  //   mat=2        : 1 + 深度書き込みを有効化
  //   mat=3        : 診断用。全パーツを不透明化
  const MAT_MODE = new URLSearchParams(location.search).get('mat') || '1';

  const infoEl = document.getElementById('info');
  const appearEl = document.getElementById('appear');
  const loopEl = document.getElementById('loop');

  const loaded = {};   // { appear: {model, mixer, duration}, loop: {..., cycleStart, cycleEnd} }
  let startMs = null;
  let phase = 'wait';

  // クリップが持つキーフレームの最初と最後の時刻(秒)
  function keyRange(clip) {
    let lo = Infinity, hi = -Infinity;
    clip.tracks.forEach((tr) => {
      lo = Math.min(lo, tr.times[0]);
      hi = Math.max(hi, tr.times[tr.times.length - 1]);
    });
    return [lo, hi];
  }

  function prepare(name, model) {
    // ── 材質の調整(元のalphaを保ち、透過表現(transmission)だけ無効化) ──
    let hiddenByAlpha = 0;
    model.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      mats.forEach((mat) => {
        mat.transmission = 0;
        if (MAT_MODE === '2') mat.depthWrite = true;
        if (MAT_MODE === '3') { mat.transparent = false; mat.opacity = 1; mat.depthWrite = true; }
        mat.needsUpdate = true;
        if (MAT_MODE !== '3' && mat.opacity <= 0.001) { node.visible = false; hiddenByAlpha++; }
      });
    });

    // ── 再生するクリップを決める ──
    let clips = model.animations || [];
    let cycleStart = 0, cycleEnd = 0;
    if (name === 'loop' && clips.length > 1) {
      // loopファイルには、同じオブジェクトに付いたクリップが複数ある。
      // 全部を同時に再生すると、同じ動きが混ざって平均されてしまうため、
      // 最後のキーが最も遅い(=30〜89fで1周するもの)1つだけを使う。
      const chosen = clips.reduce((a, b) => (keyRange(b)[1] > keyRange(a)[1] ? b : a));
      console.log('[loop] クリップ一覧:', clips.map((c) => `${c.name}(${(keyRange(c)[0] * FPS).toFixed(0)}〜${(keyRange(c)[1] * FPS).toFixed(0)}f)`).join(' / '));
      console.log('[loop] 再生に使うクリップ:', chosen.name);
      clips = [chosen];
    }
    if (name === 'loop' && clips.length === 1) {
      [cycleStart, cycleEnd] = keyRange(clips[0]);
    }

    const mixer = new THREE.AnimationMixer(model);
    clips.forEach((clip) => mixer.clipAction(clip).play());
    const duration = Math.max(...clips.map((c) => c.duration));

    console.log(`[${name}] 読み込み完了 / 再生クリップ数: ${clips.length} / 長さ: ${duration.toFixed(3)}秒 / alpha=0で非表示にしたパーツ: ${hiddenByAlpha}`);
    loaded[name] = { model, mixer, duration, cycleStart, cycleEnd };

    if (loaded.appear && loaded.loop) {
      loaded.loop.mixer.setTime(HANDOFF);   // 切り替え前に姿勢を確定しておく
      phase = 'appear';
      requestAnimationFrame(tick);
    }
  }

  // mixer.setTime(t): 全アクションを0に戻してから t 秒へ進める(=指定時刻の姿勢)。
  // 長さ以上を指定すると先頭に戻るため、末尾の直前に丸める。
  function seek(entry, t) {
    entry.mixer.setTime(Math.min(Math.max(t, 0), entry.duration - EPS));
  }

  function tick(nowMs) {
    if (startMs === null) startMs = nowMs;
    const elapsed = (nowMs - startMs) / 1000;

    if (elapsed < HANDOFF) {
      seek(loaded.appear, elapsed);
      infoEl.innerHTML = `appear 再生中 (1回) / ${(elapsed * FPS).toFixed(1)}f / mat=${MAT_MODE}`;
    } else {
      if (phase === 'appear') {                    // 28f で appear → loop に切り替え(1回だけ実行)
        seek(loaded.appear, HANDOFF);
        appearEl.object3D.visible = false;
        loopEl.object3D.visible = true;
        phase = 'loop';
        console.log('[SEQ] appear終了 → loop開始');
      }
      // loop: 切り替え時(28f)から、クリップの最後のキーまで進み、そこからは「最初のキー〜最後のキー」を繰り返す。
      // 最初と最後のキーは同じ姿勢のため、継ぎ目はなめらかに繋がる。
      const L = loaded.loop;
      let t = elapsed;
      if (t >= L.cycleEnd) t = L.cycleStart + ((t - L.cycleStart) % (L.cycleEnd - L.cycleStart));
      seek(L, t);
      infoEl.innerHTML = `loop 再生中 (ループ) / ${(t * FPS).toFixed(1)}f / mat=${MAT_MODE}`;
    }
    requestAnimationFrame(tick);
  }

  appearEl.addEventListener('model-loaded', (e) => prepare('appear', e.detail.model));
  loopEl.addEventListener('model-loaded', (e) => prepare('loop', e.detail.model));
  appearEl.addEventListener('model-error', (e) => console.error('[appear] model-error:', e.detail));
  loopEl.addEventListener('model-error', (e) => console.error('[loop] model-error:', e.detail));
</script>
</body>
</html>
