<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB単体表示テスト(appear → loop)</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin:0;">

<div id="info" style="position:fixed; top:8px; left:8px; right:8px; z-index:600; color:#fff; background:rgba(0,0,0,0.6); padding:6px 10px; font-family:sans-serif; font-size:13px; border-radius:6px; line-height:1.5;">
  読み込み中...
</div>

<a-scene background="color: #222">
  <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
  <a-light type="directional" color="#ffffff" intensity="1" position="1 1 1"></a-light>

  <!-- appear(0〜28f・1回再生)と loop(28fから・ループ再生)を、同じ位置に重ねて読み込む -->
  <a-entity id="appear" gltf-model="url(./FindAR_appear.glb)" position="0 0 -5"></a-entity>
  <a-entity id="loop" gltf-model="url(./FindAR_loop.glb)" position="0 0 -5" visible="false"></a-entity>

  <a-camera position="0 1.6 0"></a-camera>
</a-scene>

<script>
  // ════════════════════════════════════════════════
  // 設定(GLBの解析結果に基づく。24fps)
  // ════════════════════════════════════════════════
  const FPS = 24;
  const HANDOFF = 28 / FPS;   // appear は 0〜28f を1回だけ再生し、28f から loop に切り替える
  const EPS = 0.0001;

  const params = new URLSearchParams(location.search);
  // 材質の扱い(?mat=)  1(既定): 透過だけ無効化 / 2: 1+深度書き込み / 3: 診断用の全不透明化(クロスフェード不可)
  const MAT_MODE = params.get('mat') || '1';
  // appear→loop のクロスフェードの長さ(フレーム数)(?fade=)。0 なら瞬時に切り替え
  const FADE = (params.has('fade') ? parseFloat(params.get('fade')) : 8) / FPS;
  const CAN_FADE = MAT_MODE !== '3' && FADE > 0;
  // 縦軸(Y軸)まわりの回転角(度)(?ry=)。向きが逆なら -90 を指定する
  const RY = params.has('ry') ? parseFloat(params.get('ry')) : 90;

  const infoEl = document.getElementById('info');
  const appearEl = document.getElementById('appear');
  const loopEl = document.getElementById('loop');

  // appear と loop は同じ位置・同じ向きで重ねるため、同じ回転を両方に与える
  appearEl.setAttribute('rotation', `0 ${RY} 0`);
  loopEl.setAttribute('rotation', `0 ${RY} 0`);

  const loaded = {};
  let startMs = null;
  let phase = 'wait';

  function keyRange(clip) {
    let lo = Infinity, hi = -Infinity;
    clip.tracks.forEach((tr) => {
      lo = Math.min(lo, tr.times[0]);
      hi = Math.max(hi, tr.times[tr.times.length - 1]);
    });
    return [lo, hi];
  }

  // 1つのクリップだけを再生する、専用のミキサーを作る
  function makeSegment(model, clip) {
    const [start, end] = keyRange(clip);
    const mixer = new THREE.AnimationMixer(model);
    mixer.clipAction(clip).play();
    return { name: clip.name, mixer, start, end, duration: clip.duration };
  }

  function prepare(name, model) {
    // ── 材質の調整(元のalphaを保ち、透過表現(transmission)だけ無効化) ──
    let hiddenByAlpha = 0;
    const fadeMats = new Set();
    model.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      mats.forEach((mat) => {
        mat.transmission = 0;
        if (MAT_MODE === '2') mat.depthWrite = true;
        if (MAT_MODE === '3') { mat.transparent = false; mat.opacity = 1; mat.depthWrite = true; }
        mat.userData.baseOpacity = mat.opacity;
        mat.needsUpdate = true;
        if (MAT_MODE !== '3' && mat.opacity <= 0.001) { node.visible = false; hiddenByAlpha++; }
        else if (CAN_FADE) { mat.transparent = true; fadeMats.add(mat); }
      });
    });

    const clips = model.animations || [];
    const entry = { model, fadeMats };

    if (name === 'appear') {
      // appear: 全クリップを同時に再生する(それぞれ別のオブジェクトを動かすクリップのため)
      const mixer = new THREE.AnimationMixer(model);
      clips.forEach((clip) => mixer.clipAction(clip).play());
      entry.mixer = mixer;
      entry.duration = Math.max(...clips.map((c) => c.duration));
    } else {
      // loop: 同じオブジェクトに付いた複数のクリップを、同時ではなく「順番に」使う。
      //   cont  : 28fをまたぐクリップ  = appearの動きの続き(28fの姿勢がappearと一致する)
      //   cycle : 残りのうち最後まで続くクリップ = その後に繰り返す1周分の動き
      const ranges = clips.map((c) => ({ clip: c, r: keyRange(c) }));
      const contR = ranges.find((x) => x.r[0] < HANDOFF - EPS && x.r[1] > HANDOFF + EPS);
      const cycleR = ranges.filter((x) => x !== contR).sort((a, b) => b.r[1] - a.r[1])[0] || contR;
      entry.cont = contR ? makeSegment(model, contR.clip) : null;
      entry.cycle = makeSegment(model, cycleR.clip);
      console.log('[loop] クリップ一覧:', ranges.map((x) => `${x.clip.name}(${(x.r[0] * FPS).toFixed(0)}〜${(x.r[1] * FPS).toFixed(0)}f)`).join(' / '));
      console.log('[loop] 28fからの続き:', entry.cont ? entry.cont.name : 'なし', '/ 繰り返し:', entry.cycle.name);
    }

    console.log(`[${name}] 読み込み完了 / クリップ数: ${clips.length} / alpha=0で非表示: ${hiddenByAlpha} / フェード対象材質: ${fadeMats.size}`);
    loaded[name] = entry;

    if (loaded.appear && loaded.loop) {
      seekLoop(0);          // 切り替え前に、loopの28fの姿勢を確定しておく
      phase = 'appear';
      requestAnimationFrame(tick);
    }
  }

  function seekSeg(seg, t) {
    seg.mixer.setTime(Math.min(Math.max(t, 0), seg.duration - EPS));
  }

  // loop: s = 切り替え(28f)からの経過秒。 28f→(続きのクリップの最後)→(繰り返しの最初〜最後を繰り返す)
  function seekLoop(s) {
    const L = loaded.loop;
    const tNow = HANDOFF + s;
    let seg, t;
    if (L.cont && tNow < L.cont.end) {
      seg = L.cont; t = tNow;
    } else if (L.cont) {
      const u = tNow - L.cont.end;
      seg = L.cycle; t = L.cycle.start + (u % (L.cycle.end - L.cycle.start));
    } else {
      seg = L.cycle;
      t = tNow < L.cycle.end ? tNow : L.cycle.start + ((tNow - L.cycle.start) % (L.cycle.end - L.cycle.start));
    }
    seekSeg(seg, t);
    return { seg, t };
  }

  function setOpacity(entry, k) {
    entry.fadeMats.forEach((m) => { m.opacity = m.userData.baseOpacity * k; });
  }

  function tick(nowMs) {
    if (startMs === null) startMs = nowMs;
    const elapsed = (nowMs - startMs) / 1000;
    const tag = `mat=${MAT_MODE} fade=${(FADE * FPS).toFixed(0)}f ry=${RY}`;

    if (elapsed < HANDOFF) {
      seekSeg(loaded.appear, elapsed);
      infoEl.innerHTML = `appear 再生中 (1回) / ${(elapsed * FPS).toFixed(1)}f / ${tag}`;
    } else {
      const since = elapsed - HANDOFF;

      if (phase === 'appear') {                    // 28f: appearの姿を確定し、loopを表示する(1回だけ実行)
        seekSeg(loaded.appear, HANDOFF);
        loopEl.object3D.visible = true;
        if (CAN_FADE) setOpacity(loaded.loop, 0);
        phase = CAN_FADE ? 'fade' : 'loop';
        if (!CAN_FADE) appearEl.object3D.visible = false;
        console.log('[SEQ] appear終了 → loop開始 /', CAN_FADE ? 'クロスフェード' : '瞬時に切り替え');
      }

      const { seg, t } = seekLoop(since);

      let label = 'loop 再生中';
      if (phase === 'fade') {
        const k = Math.min(since / FADE, 1);
        const e = k * k * (3 - 2 * k);
        setOpacity(loaded.appear, 1 - e);
        setOpacity(loaded.loop, e);
        label = `クロスフェード中 ${(k * 100).toFixed(0)}%`;
        if (k >= 1) { appearEl.object3D.visible = false; phase = 'loop'; }
      }
      infoEl.innerHTML = `${label} (${seg.name}) / ${(t * FPS).toFixed(1)}f / ${tag}`;
    }
    requestAnimationFrame(tick);
  }

  appearEl.addEventListener('model-loaded', (e) => prepare('appear', e.detail.model));
  loopEl.addEventListener('model-loaded', (e) => prepare('loop', e.detail.model));
  appearEl.addEventListener('model-error', (e) => console.error('[appear] model-error:', e.detail));
  loopEl.addEventListener('model-error', (e) => console.error('[loop] model-error:', e.detail));
</script>
</body>
</html>
