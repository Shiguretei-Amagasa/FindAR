<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB単体表示テスト</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin:0;">

<div style="position:fixed; top:8px; left:8px; right:8px; z-index:600; color:#fff; background:rgba(0,0,0,0.6); padding:6px 10px; font-family:sans-serif; font-size:13px; border-radius:6px;">
  AR・GPSなし。モデルを正面の固定位置に置くだけのテストです
</div>

<a-scene background="color: #222">
  <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
  <a-light type="directional" color="#ffffff" intensity="1" position="1 1 1"></a-light>

  <a-entity
    id="model"
    gltf-model="url(./FindAR_appear.glb)"
    position="0 0 -5"
  ></a-entity>

  <a-camera position="0 1.6 0"></a-camera>
</a-scene>

<script>
  document.getElementById('model').addEventListener('model-loaded', (e) => {
    console.log('[TEST] model-loaded 成功');
    const model = e.detail.model;

    // ── スケールを1倍に固定 ──
    model.scale.set(1, 1, 1);

    // ── 全マテリアルを両面表示・不透明化する(KHR_materials_transmissionによる非表示を防ぐ) ──
    model.traverse((node) => {
      if (node.isMesh && node.material) {
        const materials = Array.isArray(node.material) ? node.material : [node.material];
        materials.forEach((mat) => {
          mat.side = THREE.DoubleSide;
          mat.transmission = 0;
          mat.transparent = false;
          mat.opacity = 1;
          mat.depthWrite = true;
          mat.needsUpdate = true;
        });
      }
    });

    // ── サイズ・中心位置の確認(診断用) ──
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    box.getSize(size);
    const center = new THREE.Vector3();
    box.getCenter(center);
    console.log('[TEST] 実寸サイズ(X,Y,Z):', size.x.toFixed(3), size.y.toFixed(3), size.z.toFixed(3));
    console.log('[TEST] 中心位置(X,Y,Z):', center.x.toFixed(3), center.y.toFixed(3), center.z.toFixed(3));

    // ── アニメーション対象ノードを正規の方法で特定し、対象外(完成形)は先に非表示にする ──
    const clips = model.animations;
    console.log('[TEST] アニメーション数:', clips ? clips.length : 0);

    if (!clips || clips.length === 0) {
      console.log('[TEST] このモデルにはアニメーションが含まれていません');
      return;
    }

    const noClipMeshes = [];
    let meshCount = 0;
    model.traverse((node) => {
      if (node.isMesh) {
        meshCount++;
        if (node.name.startsWith('Target_All')) {
          node.visible = false;
          noClipMeshes.push(node);
        }
      }
    });
    console.log('[TEST] メッシュ総数:', meshCount, '/ 非表示にした数(Target_All):', noClipMeshes.length);
    
    // ── 全クリップを1回だけ再生し、終了後は最後の状態で静止させる ──
    const mixer = new THREE.AnimationMixer(model);
    clips.forEach((clip) => {
      const action = mixer.clipAction(clip);
      action.setLoop(THREE.LoopOnce);
      action.clampWhenFinished = true;
      action.play();
    });
    console.log('[TEST] 全', clips.length, '個のクリップを1回再生で開始');

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      mixer.update(clock.getDelta());
    }
    animate();

    // ── 最長クリップの再生が終わったタイミングで、完成形メッシュを表示に切り替える ──
    const maxDuration = Math.max(...clips.map((c) => c.duration));
    console.log('[TEST] 最長クリップの長さ(秒):', maxDuration);
    setTimeout(() => {
      noClipMeshes.forEach((node) => { node.visible = true; });
      console.log('[TEST] 組み立て完了。完成形メッシュを表示に切り替えました');
    }, maxDuration * 1000);
  });

  document.getElementById('model').addEventListener('model-error', (e) => {
    console.error('[TEST] model-error:', e.detail);
  });
</script>
</body>
</html>
