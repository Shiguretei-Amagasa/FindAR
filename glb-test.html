<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB単体表示テスト</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin:0;">

<div style="position:fixed; top:8px; left:8px; right:8px; z-index:600; color:#fff; background:rgba(0,0,0,0.6); padding:6px 10px; font-family:sans-serif; font-size:13px; border-radius:6px;">
  AR・GPSなし。モデルを正面の固定位置に置くだけのテストです
</div>

<a-scene background="color: #222">
  <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
  <a-light type="directional" color="#ffffff" intensity="1" position="1 1 1"></a-light>

  <!-- カメラの正面5m先、等倍(scale指定なし)でモデルを配置 -->
  <a-entity
    id="model"
    gltf-model="url(./FindAR_appear.glb)"
    position="0 0 -5"
  ></a-entity>

  <a-camera position="0 1.6 0"></a-camera>
</a-scene>

<script>
  document.getElementById('model').addEventListener('model-loaded', (e) => {
    console.log('[TEST] model-loaded 成功');
    e.detail.model.scale.set(1, 1, 1);
    console.log('[TEST] スケールを強制的に1,1,1へ上書きしました');
    const mesh = e.detail.model;
    const box = new THREE.Box3().setFromObject(mesh);
    const size = new THREE.Vector3();
    box.getSize(size);
    const center = new THREE.Vector3();
    box.getCenter(center);
    console.log('[TEST] モデルの実寸サイズ(X,Y,Z):', size.x.toFixed(3), size.y.toFixed(3), size.z.toFixed(3));
    console.log('[TEST] モデルの中心位置(原点からのズレ X,Y,Z):', center.x.toFixed(3), center.y.toFixed(3), center.z.toFixed(3));
  });
  document.getElementById('model').addEventListener('model-error', (e) => {
    console.error('[TEST] model-error:', e.detail);
  });
</script>
</body>
</html>
