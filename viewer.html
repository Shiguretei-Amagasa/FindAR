const RECAPTCHA_SITE_KEY = "6LeQYFItAAAAAGaVvZx_Txa8M26qytXHou4ZXmqk";

// ════════════════════════════════════════════════
// 設定(URLパラメータで上書き可能)
//   ?debug=1     スマホ用コンソール(eruda)と、方位・距離のデバッグ表示を出す
//   ?id=xxxx     モードB: Firestoreの座標に配置(通常の使い方) / 付けない: モードA(自分の北約11mに配置。動作確認用)
//   ?anim=0      0: 静止表示(frameで指定した姿勢) / 付けない: 出現→ループのアニメーション再生(既定)
//   ?frame=30    静止表示(anim=0)のときのフレーム(既定30 = 立方体が消えて破片のブロックが残った姿勢)
//   ── 大きさと高さ(距離に応じて自動調整) ──
//   ?base=4      距離10mでのモデルの実寸の幅(m)。遠いほど (距離/10)^alpha 倍に大きくなる
//   ?alpha=0.6   遠くをどれだけ大きくするか。0=実寸のまま(遠いと小さく見える) / 1=見かけの大きさが一定(近づいても大きくならない)
//   ?fit=0.6     近くで大きくなりすぎないための上限。画面の横幅(縦持ち)に対するモデルの幅の割合
//   ?smin=0.15   拡大率の下限
//   ?smax=30     拡大率の上限
//   ?h=10        地上からの高さ(m)。モデルの中心がこの高さに来る
//   ?anchor=bottom  h をモデルの「下端」の高さにする(既定は中心)
//   ?eye=1.6     スマホを持つ目の高さ(m)。地面の位置の推定に使う
//   ?yoff=0      高さの微調整(m。上に上げるなら正の値)
//   ── 方位の補正(iPhoneでAR.jsの向きがOSのコンパスとずれるのを補正する) ──
//   ?comp=0      0: 自動補正をやめる(既定は補正あり。iPhoneのみ)
//   ?yaw=0       手動の補正(度)。自動補正の上にさらに足す。正の値で、対象が見える向きを時計回りに回す
//   ?scale=1     base にかける倍率(全体をもう少し大きく/小さくしたいとき)
//   ?ry=90       Y軸まわりの回転角(度)
//   ?emi=0.55    発光倍率(1だと白飛びする)
//   ?loop=30 ?end=90 ?fps=24   anim=1 のときのループ区間(終了はモデルの最終キー88fに切り詰め)
//   ?box=1       GLBと同じ座標に、基準版と同じ赤い箱も出す(「配置できていない」のか「GLBが見えない」のかの切り分け用)
//   ?src=...     GLBのパス(既定 ./FindAR_v8.glb)
// ════════════════════════════════════════════════
const params = new URLSearchParams(location.search);
const num = (k, d) => (params.has(k) ? parseFloat(params.get(k)) : d);
const ANIM = params.get('anim') !== '0';   // 既定はアニメーション再生。?anim=0 で静止表示
const STATIC_FRAME = num('frame', 30);
const SCALE = num('scale', 1);
const YOFF = num('yoff', 0);
const FIT = num('fit', 0.6);
const BASE = num('base', 4);
const ALPHA = num('alpha', 0.6);
const SMIN = num('smin', 0.15);
const SMAX = num('smax', 30);
const HEIGHT = num('h', 10);
const EYE = num('eye', 1.6);
const ANCHOR = params.get('anchor') === 'bottom' ? 'bottom' : 'center';
const YAW = num('yaw', 0);
const COMP = params.get('comp') !== '0';
const BUILD = 'yaw1';   // 画面下の表示とログに出す版の目印(古いファイルが読まれていないかの確認用)
console.log('[BUILD]', BUILD);
const RY = num('ry', 90);
const EMI = num('emi', 0.55);
const FPS = num('fps', 24);
const LOOP_START_F = num('loop', 30);
const LOOP_END_F = num('end', 90);
const SRC = params.get('src') || './FindAR_v8.glb';
const SHOW_BOX = params.get('box') === '1';
const DEBUG = params.get('debug') === '1';
if (DEBUG) document.getElementById('debug-display').style.display = 'block';

const statusEl = document.getElementById('status');
const cameraEl = document.querySelector('[gps-new-camera]');
const sceneEl = document.querySelector('a-scene');
const meetupId = params.get('id');

let target = null;   // モードBのみ使用: Firestoreの座標
let lastFix = null;  // 自分の最新のGPS位置
let placed = false;
let holo = null;
let ref = null;            // 位置の基準になる、見えない目印(GPS配置の計算だけを使う)
const followers = [];      // 補正した位置に置くエンティティ(モデル・赤い箱)

// ── モードB: ?id=xxxx がある場合のみFirestoreから座標を取得(ページ読み込み時に自動実行) ──
async function loadTarget() {
  if (!meetupId) {
    statusEl.textContent = 'モードA: 自分の位置の北約11mに配置します';
    return;
  }
  statusEl.textContent = 'モードB: Firestoreから座標を取得中...';
  try {
    const app = initializeApp(firebaseConfig);
    // App Check は Firestore を使う前に初期化する。失敗しても座標の取得は試みる(適用がオフなら通る)
    if (RECAPTCHA_SITE_KEY && !RECAPTCHA_SITE_KEY.startsWith('YOUR_')) {
      try {
        if (new URLSearchParams(location.search).get('appcheckdebug') === '1') self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
        initializeAppCheck(app, { provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY), isTokenAutoRefreshEnabled: true });
        console.log('[APPCHECK] 初期化しました');
      } catch (e) {
        console.error('[APPCHECK] 初期化に失敗しました', e);
      }
    } else {
      console.log('[APPCHECK] サイトキー未設定のため、App Check は使いません');
    }
    const db = getFirestore(app);
    const snap = await getDoc(doc(db, 'meetups', meetupId));
    if (!snap.exists()) { statusEl.textContent = '座標が見つかりませんでした(idを確認してください)'; return; }
    const data = snap.data();
    target = { lat: data.lat, lng: data.lng };
    console.log('[FIRESTORE] target fetched', target);
    statusEl.textContent = `モードB: 対象座標 ${target.lat.toFixed(6)}, ${target.lng.toFixed(6)}`;
  } catch (err) {
    console.error('[FIRESTORE] error', err);
    statusEl.textContent = 'Firestore取得に失敗しました';
  }
}

// ── GPS取得イベント(基準版と同じ仕組み)。ページ読み込み直後から待ち受ける ──
cameraEl.addEventListener('gps-camera-update-position', (e) => {
  lastFix = { lat: e.detail.position.latitude, lng: e.detail.position.longitude };
  console.log('[GPS] position acquired', lastFix.lat, lastFix.lng);
  tryPlace();
});

function tryPlace() {
  if (placed || !lastFix) return;
  if (meetupId && !target) return; // モードB: Firestoreの座標待ち

  const lat = target ? target.lat : lastFix.lat + 0.0001; // モードA: 北へ約11m
  const lng = target ? target.lng : lastFix.lng;
  placed = true;

  // 基準版の赤い箱と同じ流れ: 座標が判明してから「一度だけ」生成し、後から座標を書き換えない
  holo = document.createElement('a-entity');
  holo.setAttribute('gltf-model', `url(${SRC})`);
  holo.setAttribute('scale', '1 1 1');      // 実際の拡大率は fitFrame() が距離から毎フレーム決める
  holo.setAttribute('visible', 'false');    // 最初の計算が済むまで隠す(大きさが一瞬ちらつくのを防ぐ)
  holo.setAttribute('rotation', `0 ${RY} 0`);
  holo.addEventListener('model-loaded', (e) => setupModel(e.detail.model));
  holo.addEventListener('model-error', (e) => {
    console.error('[GLB] model-error', e.detail);
    statusEl.textContent += ' / GLBの読み込みに失敗(ファイル名・場所を確認)';
  });
  // AR.jsのGPS配置の計算は、見えない目印(ref)にだけ使う。
  // モデル・赤い箱は、ref の位置を「カメラの周りに方位のずれ Δ だけ回した」場所へ fitFrame() が置く
  ref = document.createElement('a-entity');
  ref.setAttribute('gps-new-entity-place', `latitude: ${lat}; longitude: ${lng};`);
  sceneEl.appendChild(ref);
  sceneEl.appendChild(holo);
  followers.push(holo);
  if (SHOW_BOX) {   // 基準版と同じ赤い箱(切り分け用)
    const box = document.createElement('a-box');
    box.setAttribute('color', 'red');
    box.setAttribute('scale', '10 10 10');
    box.setAttribute('material', 'side: double');
    sceneEl.appendChild(box);
    followers.push(box);
    console.log('[AR] 赤い箱も配置(?box=1)');
  }
  console.log('[AR] GLB entity placed', lat, lng, SRC);
  statusEl.textContent += ' / GLBを配置しました(読み込み中)';
}

// ════════════════════════════════════════════════
// GLBの準備と再生(glb-test-v8.html で確認済みの内容)
// ════════════════════════════════════════════════
let mixer = null;
let actions = [];
let loopStart = LOOP_START_F / FPS;
let loopEnd = LOOP_END_F / FPS;
let clock0 = null;

function seek(t) {
  actions.forEach(({ a, d }) => { a.time = Math.min(t, d - 0.0001); });
  mixer.update(0);
}

function timeAt(c) {
  if (c < loopStart) return c;
  return loopStart + ((c - loopStart) % (loopEnd - loopStart));
}

function setupModel(model) {
  // 材質: 透過表現(transmission)を無効化し、発光を抑える。alpha=0のメッシュは「そのメッシュだけ」隠す
  // (node.visible=false にすると、子ノードの破片244個まで消えてしまう)
  let mats = 0, hidden = 0;
  model.traverse((node) => {
    if (!node.isMesh || !node.material) return;
    (Array.isArray(node.material) ? node.material : [node.material]).forEach((mat) => {
      mats++;
      mat.transmission = 0;
      if (mat.emissiveIntensity !== undefined) mat.emissiveIntensity *= EMI;
      if (mat.opacity <= 0.001) { mat.visible = false; hidden++; }
      mat.needsUpdate = true;
    });
  });
  console.log(`[GLB] 読み込み完了 / マテリアル ${mats} / alpha=0で隠したもの ${hidden} / ry=${RY} emi=${EMI}`);

  const clips = model.animations || [];
  if (clips.length === 0) { statusEl.textContent += ' / (アニメーションなし)'; startFit(model); return; }

  mixer = new THREE.AnimationMixer(model);
  actions = clips.map((clip) => {
    const a = mixer.clipAction(clip);
    a.play();
    let start = Infinity, end = -Infinity;
    clip.tracks.forEach((tr) => { start = Math.min(start, tr.times[0]); end = Math.max(end, tr.times[tr.times.length - 1]); });
    return { a, d: clip.duration, clip, start, end };
  });

  // 同じノード・同じプロパティを動かすクリップが複数ある場合(球Action と 球Action.003)は、
  // 最後に始まるクリップだけを使う。three.jsは重なると50:50で平均してしまうため
  const byKey = new Map();
  actions.forEach((x) => {
    const key = x.clip.tracks.map((tr) => tr.name).sort().join('|');
    if (!byKey.has(key)) byKey.set(key, []);
    byKey.get(key).push(x);
  });
  byKey.forEach((g) => {
    if (g.length < 2) return;
    g.sort((p, q) => p.start - q.start);
    g.forEach((x, i) => x.a.setEffectiveWeight(i === g.length - 1 ? 1 : 0));
    console.log('[GLB] 重複クリップ:', g.map((x) => x.name || x.clip.name).join(' → '), '… 最後のものだけ使用');
  });

  const hi = Math.max(...actions.map((x) => x.end));
  if (loopEnd > hi) loopEnd = hi;

  seek((ANIM ? LOOP_START_F : STATIC_FRAME) / FPS);   // 基準の姿勢でモデルの大きさを測る
  startFit(model);

  if (!ANIM) {
    seek(STATIC_FRAME / FPS);
    statusEl.textContent += ` / 静止表示(${STATIC_FRAME}f)`;
    console.log(`[GLB] 静止表示 ${STATIC_FRAME}f`);
  } else {
    statusEl.textContent += ' / アニメーション再生';
    console.log(`[GLB] アニメーション再生 / ループ ${LOOP_START_F}〜${(loopEnd * FPS).toFixed(0)}f`);
    requestAnimationFrame(tick);
  }
}

// ════════════════════════════════════════════════
// 距離に応じた大きさと、地上からの高さ
//   ・モデルの実寸の幅を W = BASE × (距離/10)^ALPHA にする(遠いほど大きく、近いほど小さい)。
//     ALPHA が1未満なので、見かけの大きさは「近づくほど大きく」なり、距離感が保たれる。
//     ただし近くで画面からはみ出さないよう、画面の横幅の FIT 割を上限にする
//   ・モデルの中心(または下端)が、地面から HEIGHT m の高さに来るように、モデルの位置を決める
//     地面の高さ = カメラの高さ − EYE
// ════════════════════════════════════════════════
let fit = null;       // { W0: 拡大率1のときのモデルの幅, relY: 基準点の高さ(エンティティからの相対) }
let curS = null;      // 現在の拡大率(なめらかに追従)
let curFrac = 0;      // 画面の横幅に対する見かけの幅(診断表示用)
let fitModel = null;
let fitShown = false;
let relS = null;          // カメラから見た対象の相対位置(なめらかに追従させる)

function startFit(model) {
  holo.object3D.updateMatrixWorld(true);
  const box = new THREE.Box3();
  model.traverse((o) => {
    if (!o.isMesh) return;
    const m = Array.isArray(o.material) ? o.material[0] : o.material;
    const e = o.matrixWorld.elements;
    for (let p = o; p && p !== model.parent; p = p.parent) if (!p.visible) return;   // エンティティ自体(最初は非表示)は除く
    if (m && m.visible && Math.hypot(e[0], e[1], e[2]) > 0.001) box.expandByObject(o);
  });
  const ep = holo.object3D.position;
  if (box.isEmpty()) {
    console.warn('[FIT] 見えているメッシュがなく、大きさを測れませんでした。仮の値(幅4・中心3.5)を使います');
    fit = { W0: 4, relY: 3.5 - ep.y };
  } else {
    const sz = box.getSize(new THREE.Vector3());
    const anchorY = ANCHOR === 'bottom' ? box.min.y : (box.min.y + box.max.y) / 2;
    fit = { W0: Math.max(sz.x, sz.z), relY: anchorY - ep.y };
    console.log(`[FIT] 基準サイズ 幅${Math.max(sz.x, sz.z).toFixed(2)} 高さ${sz.y.toFixed(2)} / 基準点(${ANCHOR})のエンティティからの高さ ${fit.relY.toFixed(2)}`);
  }
  fitModel = model;
  requestAnimationFrame(fitFrame);
}

// ── 方位補正 ──
// iPhoneでは、AR.jsが使っているカメラの向きが、OSのコンパスと大きくずれることがある。
// そのずれ Δ(AR.jsの向き − OSコンパス)を、スマホを縦に持っている間だけ測り(なめらかに平均)、
// 対象の位置を「カメラの周りに Δ だけ回して」置くことで、実際の方角に見えるようにする。
let appliedDelta = 0;
let deltaVec = null;
let yawReason = '-';
let yawLogAt = 0;
function currentDelta(cam) {
  const reason = !COMP ? '補正オフ(comp=0)' : !ori.ios ? 'iOS以外(補正なし)' : ori.compass === null ? 'コンパス未取得'
    : (ori.beta === null || ori.beta <= 40 || ori.beta >= 140) ? '傾き範囲外(直前の値を保持)' : '測定中';
  if (reason !== yawReason) { yawReason = reason; console.log(`[YAW] 状態: ${reason}`); }
  if (COMP && ori.ios && ori.compass !== null && ori.beta !== null && ori.beta > 40 && ori.beta < 140) {
    const dir = new THREE.Vector3();
    cam.getWorldDirection(dir);
    const g = Math.atan2(dir.x, -dir.z) - ori.compass * Math.PI / 180;
    const vx = Math.cos(g), vy = Math.sin(g);   // 角度は円なので、単位ベクトルで平均する
    deltaVec = deltaVec === null ? { x: vx, y: vy } : { x: deltaVec.x + (vx - deltaVec.x) * 0.05, y: deltaVec.y + (vy - deltaVec.y) * 0.05 };
  }
  const auto = deltaVec ? Math.atan2(deltaVec.y, deltaVec.x) * 180 / Math.PI : 0;
  const now = performance.now();
  if (now - yawLogAt > 2000) {
    yawLogAt = now;
    console.log(`[YAW] Δ(AR.js−OSコンパス)=${auto.toFixed(0)}° / 適用=${(auto + YAW).toFixed(0)}° / OSコンパス=${ori.compass === null ? '-' : ori.compass.toFixed(0)}° / 傾き=${ori.beta === null ? '-' : ori.beta.toFixed(0)}°`);
  }
  return auto + YAW;
}

function fitFrame() {
  requestAnimationFrame(fitFrame);
  const cam = cameraEl.getObject3D('camera');
  if (!fit || !cam || !holo || !holo.object3D || !ref) return;
  const cp = cameraEl.object3D.position;
  const rp = ref.object3D.position;
  if (rp.x === 0 && rp.z === 0) return;   // ref のGPS配置の計算がまだ
  appliedDelta = currentDelta(cam);
  const r = appliedDelta * Math.PI / 180, co = Math.cos(r), si = Math.sin(r);
  const vx = rp.x - cp.x, vz = rp.z - cp.z;
  const px = cp.x + vx * co - vz * si;
  const pz = cp.z + vx * si + vz * co;
  // GPSが更新されたとき、モデルが一気に飛ばないよう、カメラから見た相対位置をなめらかに追従させる
  const tx = px - cp.x, tz = pz - cp.z;
  if (relS === null) relS = { x: tx, z: tz };
  else { relS.x += (tx - relS.x) * 0.15; relS.z += (tz - relS.z) * 0.15; }
  followers.forEach((f) => f.object3D.position.set(cp.x + relS.x, rp.y, cp.z + relS.z));
  const ep = holo.object3D.position;
  const d = Math.max(Math.hypot(cp.x - ep.x, cp.z - ep.z), 1);
  // 画面の横幅(いまの向きの画面)で、距離 d の位置に見える実寸
  const hFov = 2 * Math.atan(Math.tan(cam.fov * Math.PI / 360) * (cam.aspect || 0.75));
  const screenW = 2 * d * Math.tan(hFov / 2);
  const W = Math.min(BASE * SCALE * Math.pow(d / 10, ALPHA), FIT * screenW);   // 世界での幅(m)
  const target = Math.min(Math.max(W / fit.W0, SMIN), SMAX);
  curFrac = curS === null ? 0 : (curS * fit.W0) / screenW;                    // 画面の横幅に対する、いまの見かけの幅
  curS = curS === null ? target : curS + (target - curS) * 0.08;   // GPSのゆらぎで大きさが暴れないよう、なめらかに追従
  holo.object3D.scale.setScalar(curS);
  const groundY = cp.y - EYE;
  fitModel.position.y = (groundY + HEIGHT + YOFF - ep.y) / curS - fit.relY;
  if (!fitShown) { holo.setAttribute('visible', 'true'); fitShown = true; console.log(`[FIT] 表示開始 / 距離${d.toFixed(1)}m 拡大率${curS.toFixed(2)} カメラY${cp.y.toFixed(2)}`); }
}

function tick(nowMs) {
  if (clock0 === null) clock0 = nowMs;
  seek(timeAt((nowMs - clock0) / 1000));
  requestAnimationFrame(tick);
}

// OSのコンパス値(診断用・読み取りのみ): AR.jsが使っているカメラの向きと、OS自身のコンパスの値を比べる
const ori = { compass: null, beta: null, ios: false };
function onOri(e) {
  const c = (typeof e.webkitCompassHeading === 'number') ? e.webkitCompassHeading
          : (e.absolute && e.alpha !== null ? (360 - e.alpha) % 360 : null);
  if (typeof e.webkitCompassHeading === 'number') ori.ios = true;
  if (c !== null) ori.compass = c;
  if (e.beta !== null) ori.beta = e.beta;
}
window.addEventListener('deviceorientation', onOri);
window.addEventListener('deviceorientationabsolute', onOri);

// GPSの精度(診断用・読み取りのみ): 現在地の誤差の目安(m)
let gpsAcc = null;
let gpsRaw = null;   // ブラウザが返した最新のGPS位置(AR.jsが採用した位置と比べるため)
if (navigator.geolocation) {
  navigator.geolocation.watchPosition((p) => { gpsAcc = p.coords.accuracy; gpsRaw = { lat: p.coords.latitude, lng: p.coords.longitude }; }, () => {}, { enableHighAccuracy: true, maximumAge: 0 });
}

// 方位の確認(読み取り専用): スマホを回したときに「向き」が変わるか、対象がどちら側にあるかを表示する
setInterval(() => {
  if (!DEBUG) return;
  const el = document.getElementById('debug-display');
  const cam = cameraEl.getObject3D('camera');
  if (!lastFix || !cam) return;
  const tgt = target || (placed ? { lat: lastFix.lat + 0.0001, lng: lastFix.lng } : null);
  if (!tgt) return;
  const M = 111195;
  const dN = (tgt.lat - lastFix.lat) * M;
  const dE = (tgt.lng - lastFix.lng) * M * Math.cos(lastFix.lat * Math.PI / 180);
  const bearing = (Math.atan2(dE, dN) * 180 / Math.PI + 360) % 360;      // 対象の方角(北から時計回り)
  const dir = new THREE.Vector3();
  cam.getWorldDirection(dir);
  const heading = (Math.atan2(dir.x, -dir.z) * 180 / Math.PI + 360) % 360; // カメラの向き(北から時計回り)
  const hFix = (heading - appliedDelta + 720) % 360;                       // 補正後のカメラの向き
  const diff = ((bearing - hFix + 540) % 360) - 180;                      // +なら対象は右側
  const cmp = ori.compass;
  const gap = cmp === null ? null : ((heading - cmp + 540) % 360) - 180;   // AR.jsの向き − OSコンパス
  el.innerHTML = `距離${Math.hypot(dN, dE).toFixed(1)}m / 対象の方角${bearing.toFixed(0)}° / カメラの向き${hFix.toFixed(0)}°(補正後) / 差${diff > 0 ? '+' : ''}${diff.toFixed(0)}°(+は右)<br>` +
    `OSコンパス${cmp === null ? '取得なし' : cmp.toFixed(0) + '°'} / AR.jsとのずれ${gap === null ? '-' : (gap > 0 ? '+' : '') + gap.toFixed(0) + '°'} / [${BUILD}] ${yawReason} / 補正${appliedDelta.toFixed(0)}° / AR.js生${heading.toFixed(0)}° / GPS精度${gpsAcc === null ? '-' : '±' + gpsAcc.toFixed(0) + 'm'} / 傾き${ori.beta === null ? '-' : ori.beta.toFixed(0) + '°'}` +
    (curS !== null ? ` / 拡大率${curS.toFixed(1)} 画面幅比${(curFrac * 100).toFixed(0)}% カメラY${cameraEl.object3D.position.y.toFixed(1)}` : '');
  const rawGap = gpsRaw ? Math.hypot((gpsRaw.lat - lastFix.lat) * M, (gpsRaw.lng - lastFix.lng) * M * Math.cos(lastFix.lat * Math.PI / 180)) : null;
  el.innerHTML += `<br>対象 ${tgt.lat.toFixed(6)}, ${tgt.lng.toFixed(6)} / 現在 ${lastFix.lat.toFixed(6)}, ${lastFix.lng.toFixed(6)}` +
    `<br>ブラウザの最新GPSとAR.js採用位置の差 ${rawGap === null ? '-' : rawGap.toFixed(0) + 'm'}` +
    `<br>カメラ縦画角${cam.fov.toFixed(0)}° アスペクト${cam.aspect.toFixed(2)} / 画面${sceneEl.canvas ? sceneEl.canvas.clientWidth + '×' + sceneEl.canvas.clientHeight : '-'}`;
}, 300);

// 距離表示: AR.jsの内部座標は水平方向が伸びているため、GPSから計算した「実際のメートル」で表示する。
// 近いとき(GPS精度の2倍、最低25m)は、方向がずれて見えることがある旨を案内する
setInterval(() => {
  if (!lastFix || !placed) return;
  const tgt = target || { lat: lastFix.lat + 0.0001, lng: lastFix.lng };
  const M = 111195;
  const dist = Math.hypot((tgt.lat - lastFix.lat) * M, (tgt.lng - lastFix.lng) * M * Math.cos(lastFix.lat * Math.PI / 180));
  const near = Math.max(25, 2 * (gpsAcc ?? 15));
  const el = document.getElementById('distance-display');
  el.innerHTML = `対象まで 約${dist.toFixed(0)}m` +
    (dist < near ? `<br><span style="font-size:13px; font-weight:normal;">すぐ近くです。GPSの誤差(±${gpsAcc === null ? '?' : gpsAcc.toFixed(0)}m)で、実際の位置と少しずれて見えることがあります。周りを見回してください</span>` : '');
}, 300);

loadTarget().then(tryPlace);
</script>
</body>
</html>
