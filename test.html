<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindAR - GLB表示テスト</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

<div id="status" style="position:fixed; top:8px; left:8px; right:8px; z-index:600; color:#fff; background:rgba(0,0,0,0.5); padding:6px 10px; font-family:sans-serif; font-size:13px; border-radius:6px;">
  読み込み中...
</div>
<div id="debug-display" style="position:fixed; bottom:44px; left:8px; right:8px; z-index:600; text-align:center; color:#fff; background:rgba(0,0,0,0.5); padding:4px 8px; font-family:sans-serif; font-size:12px; border-radius:6px;"></div>
<div id="distance-display" style="position:fixed; bottom:16px; left:0; right:0; z-index:600; text-align:center; color:#fff; font-size:16px; font-weight:bold; text-shadow:0 1px 4px #000;"></div>

<!-- 動作確認済みの基準版(位置情報成功test.html)の構成のまま。
     変更点は「赤い箱 → FindAR_v8.glb」への置き換えと、ライト2つの追加のみ。
     カスタムのタップ画面・videoTexture・look-controls関連の追加は一切なし -->
<a-scene
  vr-mode-ui="enabled: false"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="antialias: true; alpha: true;"
>
  <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
  <a-light type="directional" color="#ffffff" intensity="1" position="1 1 1"></a-light>
  <a-camera gps-new-camera="gpsMinDistance: 5;"></a-camera>
</a-scene>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ════════════════════════════════════════════════
// TODO: index.htmlと同じFirebaseプロジェクトの値に置き換えてください
// (?idを付けて開く「モードB」でのみ使用されます)
// ════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyByb6EuWZ9Iy9QiR0Nw6IWRb8O_JQqpMSc",
  authDomain: "findar-ae099.firebaseapp.com",
  databaseURL: "https://findar-ae099-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "findar-ae099",
  storageBucket: "findar-ae099.firebasestorage.app",
  messagingSenderId: "1043165089164",
  appId: "1:1043165089164:web:0db15bfbef3d85d8df1aa9",
  measurementId: "G-J7H2LC9FFS"
};

// ════════════════════════════════════════════════
// 設定(URLパラメータで上書き可能)
//   ?id=xxxx     モードB: Firestoreの座標に配置 / 付けない: モードA(自分の北約11mに配置)
//   ?anim=1      1: 出現→ループのアニメーション再生 / 付けない: 静止表示(frameで指定した姿勢)
//   ?frame=30    静止表示のときのフレーム(既定30 = 立方体が消えて破片のブロックが残った姿勢)
//   ?scale=1     モデルの拡大率(遠くから見たいときは 2〜3 に)
//   ?yoff=0      モデルの高さ調整(モデル内の単位。頭上に出すぎるなら負の値、例 -3.5)
//   ?ry=90       Y軸まわりの回転角(度)
//   ?emi=0.55    発光倍率(1だと白飛びする)
//   ?loop=30 ?end=90 ?fps=24   anim=1 のときのループ区間(終了はモデルの最終キー88fに切り詰め)
//   ?box=1       GLBと同じ座標に、基準版と同じ赤い箱も出す(「配置できていない」のか「GLBが見えない」のかの切り分け用)
//   ?src=...     GLBのパス(既定 ./FindAR_v8.glb)
// ════════════════════════════════════════════════
const params = new URLSearchParams(location.search);
const num = (k, d) => (params.has(k) ? parseFloat(params.get(k)) : d);
const ANIM = params.get('anim') === '1';
const STATIC_FRAME = num('frame', 30);
const SCALE = num('scale', 1);
const YOFF = num('yoff', 0);
const RY = num('ry', 90);
const EMI = num('emi', 0.55);
const FPS = num('fps', 24);
const LOOP_START_F = num('loop', 30);
const LOOP_END_F = num('end', 90);
const SRC = params.get('src') || './FindAR_v8.glb';
const SHOW_BOX = params.get('box') === '1';

const statusEl = document.getElementById('status');
const cameraEl = document.querySelector('[gps-new-camera]');
const sceneEl = document.querySelector('a-scene');
const meetupId = params.get('id');

let target = null;   // モードBのみ使用: Firestoreの座標
let lastFix = null;  // 自分の最新のGPS位置
let placed = false;
let holo = null;

// ── モードB: ?id=xxxx がある場合のみFirestoreから座標を取得(ページ読み込み時に自動実行) ──
async function loadTarget() {
  if (!meetupId) {
    statusEl.textContent = 'モードA: 自分の位置の北約11mに配置します';
    return;
  }
  statusEl.textContent = 'モードB: Firestoreから座標を取得中...';
  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const snap = await getDoc(doc(db, 'meetups', meetupId));
    if (!snap.exists()) { statusEl.textContent = '座標が見つかりませんでした(idを確認してください)'; return; }
    const data = snap.data();
    target = { lat: data.lat, lng: data.lng };
    console.log('[FIRESTORE] target fetched', target);
    statusEl.textContent = `モードB: 対象座標 ${target.lat.toFixed(6)}, ${target.lng.toFixed(6)}`;
  } catch (err) {
    console.error('[FIRESTORE] error', err);
    statusEl.textContent = 'Firestore取得に失敗しました';
  }
}

// ── GPS取得イベント(基準版と同じ仕組み)。ページ読み込み直後から待ち受ける ──
cameraEl.addEventListener('gps-camera-update-position', (e) => {
  lastFix = { lat: e.detail.position.latitude, lng: e.detail.position.longitude };
  console.log('[GPS] position acquired', lastFix.lat, lastFix.lng);
  tryPlace();
});

function tryPlace() {
  if (placed || !lastFix) return;
  if (meetupId && !target) return; // モードB: Firestoreの座標待ち

  const lat = target ? target.lat : lastFix.lat + 0.0001; // モードA: 北へ約11m
  const lng = target ? target.lng : lastFix.lng;
  placed = true;

  // 基準版の赤い箱と同じ流れ: 座標が判明してから「一度だけ」生成し、後から座標を書き換えない
  holo = document.createElement('a-entity');
  holo.setAttribute('gltf-model', `url(${SRC})`);
  holo.setAttribute('scale', `${SCALE} ${SCALE} ${SCALE}`);
  holo.setAttribute('rotation', `0 ${RY} 0`);
  holo.setAttribute('gps-new-entity-place', `latitude: ${lat}; longitude: ${lng};`);
  holo.addEventListener('model-loaded', (e) => setupModel(e.detail.model));
  holo.addEventListener('model-error', (e) => {
    console.error('[GLB] model-error', e.detail);
    statusEl.textContent += ' / GLBの読み込みに失敗(ファイル名・場所を確認)';
  });
  sceneEl.appendChild(holo);
  if (SHOW_BOX) {   // 基準版と同じ赤い箱(切り分け用)
    const box = document.createElement('a-box');
    box.setAttribute('color', 'red');
    box.setAttribute('scale', '10 10 10');
    box.setAttribute('material', 'side: double');
    box.setAttribute('gps-new-entity-place', `latitude: ${lat}; longitude: ${lng};`);
    sceneEl.appendChild(box);
    console.log('[AR] 赤い箱も配置(?box=1)');
  }
  console.log('[AR] GLB entity placed', lat, lng, SRC);
  statusEl.textContent += ' / GLBを配置しました(読み込み中)';
}

// ════════════════════════════════════════════════
// GLBの準備と再生(glb-test-v8.html で確認済みの内容)
// ════════════════════════════════════════════════
let mixer = null;
let actions = [];
let loopStart = LOOP_START_F / FPS;
let loopEnd = LOOP_END_F / FPS;
let clock0 = null;

function seek(t) {
  actions.forEach(({ a, d }) => { a.time = Math.min(t, d - 0.0001); });
  mixer.update(0);
}

function timeAt(c) {
  if (c < loopStart) return c;
  return loopStart + ((c - loopStart) % (loopEnd - loopStart));
}

function setupModel(model) {
  // 材質: 透過表現(transmission)を無効化し、発光を抑える。alpha=0のメッシュは「そのメッシュだけ」隠す
  // (node.visible=false にすると、子ノードの破片244個まで消えてしまう)
  let mats = 0, hidden = 0;
  model.traverse((node) => {
    if (!node.isMesh || !node.material) return;
    (Array.isArray(node.material) ? node.material : [node.material]).forEach((mat) => {
      mats++;
      mat.transmission = 0;
      if (mat.emissiveIntensity !== undefined) mat.emissiveIntensity *= EMI;
      if (mat.opacity <= 0.001) { mat.visible = false; hidden++; }
      mat.needsUpdate = true;
    });
  });
  model.position.y += YOFF;
  console.log(`[GLB] 読み込み完了 / マテリアル ${mats} / alpha=0で隠したもの ${hidden} / scale=${SCALE} yoff=${YOFF} ry=${RY} emi=${EMI}`);

  const clips = model.animations || [];
  if (clips.length === 0) { statusEl.textContent += ' / (アニメーションなし)'; return; }

  mixer = new THREE.AnimationMixer(model);
  actions = clips.map((clip) => {
    const a = mixer.clipAction(clip);
    a.play();
    let start = Infinity, end = -Infinity;
    clip.tracks.forEach((tr) => { start = Math.min(start, tr.times[0]); end = Math.max(end, tr.times[tr.times.length - 1]); });
    return { a, d: clip.duration, clip, start, end };
  });

  // 同じノード・同じプロパティを動かすクリップが複数ある場合(球Action と 球Action.003)は、
  // 最後に始まるクリップだけを使う。three.jsは重なると50:50で平均してしまうため
  const byKey = new Map();
  actions.forEach((x) => {
    const key = x.clip.tracks.map((tr) => tr.name).sort().join('|');
    if (!byKey.has(key)) byKey.set(key, []);
    byKey.get(key).push(x);
  });
  byKey.forEach((g) => {
    if (g.length < 2) return;
    g.sort((p, q) => p.start - q.start);
    g.forEach((x, i) => x.a.setEffectiveWeight(i === g.length - 1 ? 1 : 0));
    console.log('[GLB] 重複クリップ:', g.map((x) => x.name || x.clip.name).join(' → '), '… 最後のものだけ使用');
  });

  const hi = Math.max(...actions.map((x) => x.end));
  if (loopEnd > hi) loopEnd = hi;

  if (!ANIM) {
    seek(STATIC_FRAME / FPS);
    statusEl.textContent += ` / 静止表示(${STATIC_FRAME}f)`;
    console.log(`[GLB] 静止表示 ${STATIC_FRAME}f`);
  } else {
    statusEl.textContent += ' / アニメーション再生';
    console.log(`[GLB] アニメーション再生 / ループ ${LOOP_START_F}〜${(loopEnd * FPS).toFixed(0)}f`);
    requestAnimationFrame(tick);
  }
}

function tick(nowMs) {
  if (clock0 === null) clock0 = nowMs;
  seek(timeAt((nowMs - clock0) / 1000));
  requestAnimationFrame(tick);
}

// 方位の確認(読み取り専用): スマホを回したときに「向き」が変わるか、対象がどちら側にあるかを表示する
setInterval(() => {
  const el = document.getElementById('debug-display');
  const cam = cameraEl.getObject3D('camera');
  if (!lastFix || !cam) return;
  const tgt = target || (placed ? { lat: lastFix.lat + 0.0001, lng: lastFix.lng } : null);
  if (!tgt) return;
  const M = 111195;
  const dN = (tgt.lat - lastFix.lat) * M;
  const dE = (tgt.lng - lastFix.lng) * M * Math.cos(lastFix.lat * Math.PI / 180);
  const bearing = (Math.atan2(dE, dN) * 180 / Math.PI + 360) % 360;      // 対象の方角(北から時計回り)
  const dir = new THREE.Vector3();
  cam.getWorldDirection(dir);
  const heading = (Math.atan2(dir.x, -dir.z) * 180 / Math.PI + 360) % 360; // カメラの向き(北から時計回り)
  const diff = ((bearing - heading + 540) % 360) - 180;                   // +なら対象は右側
  el.textContent = `距離${Math.hypot(dN, dE).toFixed(1)}m / 対象の方角${bearing.toFixed(0)}° / カメラの向き${heading.toFixed(0)}° / 差${diff > 0 ? '+' : ''}${diff.toFixed(0)}°(+は右)`;
}, 300);

// 距離表示(読み取り専用。描画には一切干渉しない)
setInterval(() => {
  if (!holo || !holo.object3D) return;
  const d = cameraEl.object3D.position.distanceTo(holo.object3D.position);
  document.getElementById('distance-display').textContent = `対象まで: 約${d.toFixed(1)}m`;
}, 300);

loadTarget().then(tryPlace);
</script>
</body>
</html>
