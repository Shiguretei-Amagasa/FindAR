<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindAR - STEP1: Firestore連携テスト</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

<div id="tap-overlay" style="position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; background:#000; color:#fff; font-family:sans-serif; text-align:center; padding:24px;">
  <div>
    <p style="margin-bottom:20px;">カメラ・位置情報・方位センサーの<br>使用を許可してください</p>
    <button id="tap-button" style="padding:14px 32px; font-size:16px; border-radius:999px; border:1px solid #fff; background:transparent; color:#fff;">タップして開始</button>
  </div>
</div>

<div id="status" style="position:fixed; top:8px; left:8px; right:8px; z-index:600; color:#fff; background:rgba(0,0,0,0.5); padding:6px 10px; font-family:sans-serif; font-size:13px; border-radius:6px;">
  読み込み中...
</div>
<div id="distance-display" style="position:fixed; bottom:16px; left:0; right:0; z-index:600; text-align:center; color:#fff; font-size:16px; font-weight:bold; text-shadow:0 1px 4px #000;"></div>
<div id="compass-display" style="position:fixed; top:40px; left:8px; right:8px; z-index:600; text-align:center; color:#0f0; font-size:20px; font-weight:bold; text-shadow:0 1px 4px #000;"></div>

<a-scene
  vr-mode-ui="enabled: false"
  embedded
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
  renderer="antialias: true; alpha: true;"
>
  <a-camera gps-new-camera="gpsMinDistance: 5;"></a-camera>
</a-scene>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ════════════════════════════════════════════════
// TODO: index.htmlと同じFirebaseプロジェクトの値に置き換えてください
// ════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyByb6EuWZ9Iy9QiR0Nw6IWRb8O_JQqpMSc",
  authDomain: "findar-ae099.firebaseapp.com",
  databaseURL: "https://findar-ae099-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "findar-ae099",
  storageBucket: "findar-ae099.firebasestorage.app",
  messagingSenderId: "1043165089164",
  appId: "1:1043165089164:web:0db15bfbef3d85d8df1aa9",
  measurementId: "G-J7H2LC9FFS"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const statusEl = document.getElementById('status');

// ════════════════════════════════════════════════
// 距離表示コンポーネント
// ════════════════════════════════════════════════
AFRAME.registerComponent('distance-display', {
  init: function () {
    this.cameraEl = document.querySelector('a-camera');
  },
  tick: function () {
    if (!this.cameraEl || !this.cameraEl.object3D) return;
    const distance = this.cameraEl.object3D.position.distanceTo(this.el.object3D.position);
    const el = document.getElementById('distance-display');
    if (el) el.textContent = `対象まで: 約${distance.toFixed(1)}m`;
  }
});

async function fetchTargetLocationFromFirebase() {
  const params = new URLSearchParams(location.search);
  const meetupId = params.get('id');
  if (!meetupId) return { lat: NaN, lng: NaN };
  try {
    const snap = await getDoc(doc(db, 'meetups', meetupId));
    if (!snap.exists()) return { lat: NaN, lng: NaN };
    const data = snap.data();
    return { lat: data.lat, lng: data.lng };
  } catch (err) {
    console.error('[FindAR] Firestore取得エラー:', err);
    return { lat: NaN, lng: NaN };
  }
}

// ════════════════════════════════════════════════
// GPS監視は、ページ読み込み直後・タップ操作を待たずに即座に開始する。
// 取得できた最新の自分の位置は毎回 lastKnownFix に保存し続け、
// イベントの取りこぼし(gpsMinDistanceによる再発火制限)の影響を受けないようにする。
// ════════════════════════════════════════════════
let lastKnownFix = null;
let target = null;
let boxCreated = false;

const cameraEl = document.querySelector('[gps-new-camera]');
cameraEl.addEventListener('gps-camera-update-position', (e) => {
  lastKnownFix = { lat: e.detail.position.latitude, lng: e.detail.position.longitude };
  console.log('[STEP1] 自分のGPS取得:', lastKnownFix.lat, lastKnownFix.lng);
  tryCreateBox();
});

function tryCreateBox() {
  if (boxCreated) return;
  if (!target || isNaN(target.lat)) return;
  if (!lastKnownFix) return; // まだ一度もGPSを取得していない

  boxCreated = true;
  const box = document.createElement('a-box');
  box.setAttribute('color', 'red');
  box.setAttribute('scale', '15 15 15');
  box.setAttribute('gps-new-entity-place', `latitude: ${target.lat}; longitude: ${target.lng};`);
  box.setAttribute('distance-display', '');
  document.querySelector('a-scene').appendChild(box);

  statusEl.textContent = `赤い箱を配置しました(対象座標: ${target.lat.toFixed(6)}, ${target.lng.toFixed(6)})`;
  console.log('[STEP1] 赤い箱を配置しました:', target.lat, target.lng);
  setTimeout(() => {
    console.log('[STEP1診断] 箱のvisible:', box.getAttribute('visible'));
    console.log('[STEP1診断] 箱のobject3D.visible:', box.object3D.visible);
    console.log('[STEP1診断] 箱のscale:', box.object3D.scale.x, box.object3D.scale.y, box.object3D.scale.z);
    console.log('[STEP1診断] 箱のposition:', box.object3D.position.x, box.object3D.position.y, box.object3D.position.z);
    console.log('[STEP1診断] カメラのposition:', cameraEl.object3D.position.x, cameraEl.object3D.position.y, cameraEl.object3D.position.z);
  }, 2000);
}

// ════════════════════════════════════════════════
// タップ操作：センサー許可 → Firestore取得 → target確定
// ════════════════════════════════════════════════
document.getElementById('tap-button').addEventListener('click', async () => {
  document.getElementById('tap-overlay').style.display = 'none';

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const permission = await DeviceOrientationEvent.requestPermission();
      console.log('[STEP1] 方位センサー許可結果:', permission);
    } catch (err) {
      console.error('[STEP1] 方位センサー許可エラー:', err);
    }
  }

  statusEl.textContent = 'Firestoreから座標を取得中...';
  target = await fetchTargetLocationFromFirebase();
  console.log('[STEP1] Firestore取得結果:', target);

  if (isNaN(target.lat) || isNaN(target.lng)) {
    statusEl.textContent = '座標を取得できませんでした(URLの?id=を確認してください)';
    return;
  }

  statusEl.textContent = `対象座標: ${target.lat.toFixed(6)}, ${target.lng.toFixed(6)} / GPS取得待ち...`;
  tryCreateBox(); // 既にGPSを取得済みなら、ここで即座に配置される
  window.addEventListener('deviceorientation', (event) => {
    const heading = event.webkitCompassHeading !== undefined
      ? event.webkitCompassHeading
      : (event.alpha !== null ? (360 - event.alpha) : null);
    const el = document.getElementById('compass-display');
    if (el) {
      el.textContent = heading !== null
        ? `コンパス: ${heading.toFixed(1)}°`
        : 'コンパスデータなし';
    }
  });
});
</script>
</body>
</html>
