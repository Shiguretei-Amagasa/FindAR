<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindAR - 基準版テスト</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

<div id="status" style="position:fixed; top:8px; left:8px; right:8px; z-index:600; color:#fff; background:rgba(0,0,0,0.5); padding:6px 10px; font-family:sans-serif; font-size:13px; border-radius:6px;">
  読み込み中...
</div>
<div id="distance-display" style="position:fixed; bottom:16px; left:0; right:0; z-index:600; text-align:center; color:#fff; font-size:16px; font-weight:bold; text-shadow:0 1px 4px #000;"></div>

<!-- 最初に赤い箱が見えた構成と同じ。カスタムのタップ画面・videoTexture・look-controls関連の追加は一切なし -->
<a-scene
  vr-mode-ui="enabled: false"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="antialias: true; alpha: true;"
>
  <a-camera gps-new-camera="gpsMinDistance: 5;"></a-camera>
  <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
  <a-light type="directional" color="#ffffff" intensity="1" position="1 1 1"></a-light>
</a-scene>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ════════════════════════════════════════════════
// TODO: index.htmlと同じFirebaseプロジェクトの値に置き換えてください
// (?idを付けて開く「モードB」でのみ使用されます)
// ════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyByb6EuWZ9Iy9QiR0Nw6IWRb8O_JQqpMSc",
  authDomain: "findar-ae099.firebaseapp.com",
  databaseURL: "https://findar-ae099-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "findar-ae099",
  storageBucket: "findar-ae099.firebasestorage.app",
  messagingSenderId: "1043165089164",
  appId: "1:1043165089164:web:0db15bfbef3d85d8df1aa9",
  measurementId: "G-J7H2LC9FFS"
};

const statusEl = document.getElementById('status');
const cameraEl = document.querySelector('[gps-new-camera]');
const meetupId = new URLSearchParams(location.search).get('id');

let target = null;   // モードBのみ使用: Firestoreの座標
let lastFix = null;  // 自分の最新のGPS位置
let placed = false;
let box = null;

// ── モードB: ?id=xxxx がある場合のみFirestoreから座標を取得(ページ読み込み時に自動実行) ──
async function loadTarget() {
  if (!meetupId) {
    statusEl.textContent = 'モードA: 自分の位置の北約11mに配置します';
    return;
  }
  statusEl.textContent = 'モードB: Firestoreから座標を取得中...';
  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const snap = await getDoc(doc(db, 'meetups', meetupId));
    if (!snap.exists()) { statusEl.textContent = '座標が見つかりませんでした(idを確認してください)'; return; }
    const data = snap.data();
    target = { lat: data.lat, lng: data.lng };
    console.log('[FIRESTORE] target fetched', target);
    statusEl.textContent = `モードB: 対象座標 ${target.lat.toFixed(6)}, ${target.lng.toFixed(6)}`;
  } catch (err) {
    console.error('[FIRESTORE] error', err);
    statusEl.textContent = 'Firestore取得に失敗しました';
  }
}

// ── GPS取得イベント(最初に動いた版と同じ仕組み)。ページ読み込み直後から待ち受ける ──
cameraEl.addEventListener('gps-camera-update-position', (e) => {
  lastFix = { lat: e.detail.position.latitude, lng: e.detail.position.longitude };
  console.log('[GPS] position acquired', lastFix.lat, lastFix.lng);
  tryPlace();
});

function tryPlace() {
  if (placed || !lastFix) return;
  if (meetupId && !target) return; // モードB: Firestoreの座標待ち

  const lat = target ? target.lat : lastFix.lat + 0.0001; // モードA: 北へ約11m
  const lng = target ? target.lng : lastFix.lng;
  placed = true;

  box = document.createElement('a-entity');
  box.setAttribute('gltf-model', 'url(./FindAR_appear.glb)');
  box.setAttribute('scale', '20 20 20');
  box.setAttribute('gps-new-entity-place', `latitude: ${lat}; longitude: ${lng};`);
  document.querySelector('a-scene').appendChild(box);
  console.log('[AR] model placed', lat, lng);

  box.addEventListener('model-loaded', () => {
    console.log('[AR] model-loaded event fired');
  });
  box.addEventListener('model-error', (e) => {
    console.error('[AR] model load error', e.detail);
  });
  statusEl.textContent += ' / モデルを配置しました';
}

// 距離表示(読み取り専用。描画には一切干渉しない)
setInterval(() => {
  if (!box || !box.object3D) return;
  const d = cameraEl.object3D.position.distanceTo(box.object3D.position);
  document.getElementById('distance-display').textContent = `対象まで: 約${d.toFixed(1)}m`;
}, 300);

loadTarget().then(tryPlace);
</script>
</body>
</html>
