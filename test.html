<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindAR - 位置情報にオブジェクトを配置</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

<!-- タップ操作は「方位センサーの許可」だけに使う。カメラ・GPSの初期化には一切関与しない -->
<div id="tap-overlay" style="position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; background:#000; color:#fff; font-family:sans-serif; text-align:center; padding:24px;">
  <div>
    <p style="margin-bottom:20px;">位置情報の場所にオブジェクトを表示します</p>
    <button id="tap-button" style="padding:14px 32px; font-size:16px; border-radius:999px; border:1px solid #fff; background:transparent; color:#fff;">タップして開始</button>
  </div>
</div>

<div id="status" style="position:fixed; top:8px; left:8px; right:8px; z-index:600; color:#fff; background:rgba(0,0,0,0.5); padding:6px 10px; font-family:sans-serif; font-size:13px; border-radius:6px;">
  読み込み中...
</div>
<div id="distance-display" style="position:fixed; bottom:16px; left:0; right:0; z-index:600; text-align:center; color:#fff; font-size:16px; font-weight:bold; text-shadow:0 1px 4px #000;"></div>
<div id="heading-compare" style="position:fixed; top:40px; left:8px; right:8px; z-index:600; text-align:center; color:#0f0; font-size:16px; font-weight:bold; text-shadow:0 1px 4px #000; line-height:1.6;"></div>

<!-- gps-new-cameraは静的に記述する(動的付与するとカメラ描画が停止する不具合を確認済みのため) -->
<a-scene
  vr-mode-ui="enabled: false"
  embedded
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
  renderer="antialias: true; alpha: true;"
>
  <a-camera id="main-camera" gps-new-camera="gpsMinDistance: 5;"></a-camera>
</a-scene>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ════════════════════════════════════════════════
// TODO: index.htmlと同じFirebaseプロジェクトの値に置き換えてください
// ════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyByb6EuWZ9Iy9QiR0Nw6IWRb8O_JQqpMSc",
  authDomain: "findar-ae099.firebaseapp.com",
  databaseURL: "https://findar-ae099-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "findar-ae099",
  storageBucket: "findar-ae099.firebasestorage.app",
  messagingSenderId: "1043165089164",
  appId: "1:1043165089164:web:0db15bfbef3d85d8df1aa9",
  measurementId: "G-J7H2LC9FFS"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const statusEl = document.getElementById('status');

// ════════════════════════════════════════════════
// 処理順序を確認するためのログ(ChatGPTの提案を採用)
// ════════════════════════════════════════════════
function log(step, ...args) {
  console.log(`[${step}]`, ...args);
}

log('CAMERA', 'request start');

// ════════════════════════════════════════════════
// 距離表示コンポーネント
// ════════════════════════════════════════════════
AFRAME.registerComponent('distance-display', {
  init: function () {
    this.cameraEl = document.getElementById('main-camera');
  },
  tick: function () {
    if (!this.cameraEl || !this.cameraEl.object3D) return;
    const distance = this.cameraEl.object3D.position.distanceTo(this.el.object3D.position);
    const el = document.getElementById('distance-display');
    if (el) el.textContent = `対象まで: 約${distance.toFixed(1)}m`;
  }
});

async function fetchTargetLocationFromFirebase() {
  const params = new URLSearchParams(location.search);
  const meetupId = params.get('id');
  if (!meetupId) return { lat: NaN, lng: NaN };
  try {
    const snap = await getDoc(doc(db, 'meetups', meetupId));
    if (!snap.exists()) return { lat: NaN, lng: NaN };
    const data = snap.data();
    return { lat: data.lat, lng: data.lng };
  } catch (err) {
    console.error('[FindAR] Firestore取得エラー:', err);
    return { lat: NaN, lng: NaN };
  }
}

// ════════════════════════════════════════════════
// GPS監視は、ページ読み込み直後・タップを待たずに即座に開始する
// (タップ後に開始すると最初の取得イベントを取りこぼす既知の問題があるため)
// ════════════════════════════════════════════════
let lastKnownFix = null;
let target = null;
let boxCreated = false;

const cameraEl = document.getElementById('main-camera');
cameraEl.addEventListener('gps-camera-update-position', (e) => {
  lastKnownFix = { lat: e.detail.position.latitude, lng: e.detail.position.longitude };
  log('GPS', 'position acquired', lastKnownFix.lat, lastKnownFix.lng);
  tryCreateBox();
});

function tryCreateBox() {
  if (boxCreated) return;
  if (!target || isNaN(target.lat)) return;
  if (!lastKnownFix) return;

  boxCreated = true;

  // エンティティは一度だけ生成する。生成後にsetAttributeで座標を変更しない
  // (後からの属性変更は正しく反映されない既知の問題があるため)
  const box = document.createElement('a-box');
  box.setAttribute('color', 'red');
  box.setAttribute('scale', '15 15 15');
  box.setAttribute('gps-new-entity-place', `latitude: ${target.lat}; longitude: ${target.lng};`);
  box.setAttribute('distance-display', '');
  document.querySelector('a-scene').appendChild(box);

  statusEl.textContent = `オブジェクトを配置しました(対象座標: ${target.lat.toFixed(6)}, ${target.lng.toFixed(6)})`;
  log('AR', 'object placed', target.lat, target.lng);
  setTimeout(() => {
    const dist = cameraEl.object3D.position.distanceTo(box.object3D.position);
    log('DIAG', '箱のThree.js座標(X,Y,Z):', box.object3D.position.x, box.object3D.position.y, box.object3D.position.z);
    log('DIAG', 'カメラのThree.js座標(X,Y,Z):', cameraEl.object3D.position.x, cameraEl.object3D.position.y, cameraEl.object3D.position.z);
    log('DIAG', '実際の距離(m):', dist.toFixed(2));
    log('DIAG', 'カメラのrotation(X,Y,Z度):', 
      THREE.MathUtils.radToDeg(cameraEl.object3D.rotation.x).toFixed(1),
      THREE.MathUtils.radToDeg(cameraEl.object3D.rotation.y).toFixed(1),
      THREE.MathUtils.radToDeg(cameraEl.object3D.rotation.z).toFixed(1)
    );
  }, 2000);
}

// ════════════════════════════════════════════════
// タップ操作：方位センサーの許可のみ(カメラ・GPSには一切触れない) → Firestore取得
// ════════════════════════════════════════════════
document.getElementById('tap-button').addEventListener('click', async () => {
  document.getElementById('tap-overlay').style.display = 'none';

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    log('ORIENTATION', 'permission request');
    try {
      const permission = await DeviceOrientationEvent.requestPermission();
      log('ORIENTATION', 'permission result', permission);
    } catch (err) {
      console.error('[ORIENTATION] permission error:', err);
    }
  }
  log('ORIENTATION', 'listener started (AR.js internal)');
  let latestCompassHeading = null;

  window.addEventListener('deviceorientation', (event) => {
    latestCompassHeading = event.webkitCompassHeading !== undefined
      ? event.webkitCompassHeading
      : (event.alpha !== null ? (360 - event.alpha) : null);
  });

  function applyHeadingOverride() {
    const boxEl = document.querySelector('a-box');
    if (boxEl && boxEl.object3D) {
      // 上下・左右、両方を含めて箱を直接見るようにカメラを向ける
      cameraEl.object3D.lookAt(boxEl.object3D.position);

      const el = document.getElementById('heading-compare');
      if (el) {
        const rx = THREE.MathUtils.radToDeg(cameraEl.object3D.rotation.x).toFixed(1);
        const ry = THREE.MathUtils.radToDeg(cameraEl.object3D.rotation.y).toFixed(1);
        el.innerHTML = `箱を直接照準中(lookAt使用)<br>X: ${rx}° Y: ${ry}°`;
      }
    }
    requestAnimationFrame(applyHeadingOverride);
  }
  requestAnimationFrame(applyHeadingOverride);

  statusEl.textContent = 'Firestoreから座標を取得中...';
  target = await fetchTargetLocationFromFirebase();
  log('FIRESTORE', 'target fetched', target);

  if (isNaN(target.lat) || isNaN(target.lng)) {
    statusEl.textContent = '座標を取得できませんでした(URLの?id=を確認してください)';
    return;
  }

  statusEl.textContent = `対象座標: ${target.lat.toFixed(6)}, ${target.lng.toFixed(6)} / GPS取得待ち...`;
  tryCreateBox();
});
</script>
</body>
</html>
