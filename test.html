<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindAR - フローティングオリジン検証</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

<div id="tap-overlay" style="position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; background:#000; color:#fff; font-family:sans-serif; text-align:center; padding:24px;">
  <div>
    <p style="margin-bottom:20px;">位置情報の場所にオブジェクトを表示します</p>
    <button id="tap-button" style="padding:14px 32px; font-size:16px; border-radius:999px; border:1px solid #fff; background:transparent; color:#fff;">タップして開始</button>
  </div>
</div>

<div id="status" style="position:fixed; top:8px; left:8px; right:8px; z-index:600; color:#fff; background:rgba(0,0,0,0.5); padding:6px 10px; font-family:sans-serif; font-size:13px; border-radius:6px;">
  読み込み中...
</div>
<div id="distance-display" style="position:fixed; bottom:16px; left:0; right:0; z-index:600; text-align:center; color:#fff; font-size:16px; font-weight:bold; text-shadow:0 1px 4px #000;"></div>

<a-scene
  vr-mode-ui="enabled: false"
  embedded
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
  renderer="antialias: true; alpha: true;"
>
  <!-- 実座標の計算だけに使う、非表示の基準エンティティ -->
  <a-camera id="main-camera" gps-new-camera="gpsMinDistance: 5;">
    <!-- 箱をカメラの子要素として配置する(フローティングオリジン対策)。
         カメラからの相対距離(小さい数値)だけを毎フレーム反映するため、
         GPU側のfloat32精度崩壊(AR.js公式Issue #499で報告されている既知の問題)を回避できる -->
    <a-box id="visible-box" color="red" scale="2 2 2" visible="false" material="side: double"></a-box>
  </a-camera>
</a-scene>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ════════════════════════════════════════════════
// TODO: index.htmlと同じFirebaseプロジェクトの値に置き換えてください
// ════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyByb6EuWZ9Iy9QiR0Nw6IWRb8O_JQqpMSc",
  authDomain: "findar-ae099.firebaseapp.com",
  databaseURL: "https://findar-ae099-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "findar-ae099",
  storageBucket: "findar-ae099.firebasestorage.app",
  messagingSenderId: "1043165089164",
  appId: "1:1043165089164:web:0db15bfbef3d85d8df1aa9",
  measurementId: "G-J7H2LC9FFS"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const statusEl = document.getElementById('status');

function log(step, ...args) {
  console.log(`[${step}]`, ...args);
}

async function fetchTargetLocationFromFirebase() {
  const params = new URLSearchParams(location.search);
  const meetupId = params.get('id');
  if (!meetupId) return { lat: NaN, lng: NaN };
  try {
    const snap = await getDoc(doc(db, 'meetups', meetupId));
    if (!snap.exists()) return { lat: NaN, lng: NaN };
    const data = snap.data();
    return { lat: data.lat, lng: data.lng };
  } catch (err) {
    console.error('[FindAR] Firestore取得エラー:', err);
    return { lat: NaN, lng: NaN };
  }
}

let lastKnownFix = null;
let target = null;
let referenceCreated = false;
let referenceEl = null;

const cameraEl = document.getElementById('main-camera');
const visibleBox = document.getElementById('visible-box');

cameraEl.addEventListener('gps-camera-update-position', (e) => {
  lastKnownFix = { lat: e.detail.position.latitude, lng: e.detail.position.longitude };
  log('GPS', 'position acquired', lastKnownFix.lat, lastKnownFix.lng);
  tryCreateReference();
});

function tryCreateReference() {
  if (referenceCreated) return;
  if (!target || isNaN(target.lat)) return;
  if (!lastKnownFix) return;

  referenceCreated = true;

  // 実座標の計算だけに使う、非表示の基準エンティティ(a-scene直下、巨大な座標のまま)
  referenceEl = document.createElement('a-entity');
  referenceEl.setAttribute('gps-new-entity-place', `latitude: ${target.lat}; longitude: ${target.lng};`);
  referenceEl.setAttribute('visible', 'false');
  document.querySelector('a-scene').appendChild(referenceEl);

  statusEl.textContent = `対象座標: ${target.lat.toFixed(6)}, ${target.lng.toFixed(6)}`;
  log('AR', 'reference placed', target.lat, target.lng);
}

// ════════════════════════════════════════════════
// 毎フレーム、基準エンティティとカメラの「差分(小さい数値)」だけを計算し、
// カメラの子要素である visible-box にその相対座標を直接設定する
// ════════════════════════════════════════════════
AFRAME.registerComponent('floating-origin-sync', {
  tick: function () {
    if (!referenceEl || !referenceEl.object3D) return;

    const delta = new THREE.Vector3().subVectors(
      referenceEl.object3D.position,
      cameraEl.object3D.position
    );

    // カメラは回転しているため、その回転を打ち消して「ワールド基準の相対位置」を
    // カメラのローカル座標に変換する
    const inverseQuat = cameraEl.object3D.quaternion.clone().invert();
    delta.applyQuaternion(inverseQuat);

    visibleBox.object3D.position.copy(delta);
    if (!visibleBox.getAttribute('visible')) {
      visibleBox.setAttribute('visible', true);
    }

    const el = document.getElementById('distance-display');
    if (el) el.textContent = `対象まで: 約${delta.length().toFixed(1)}m`;
  }
});
cameraEl.setAttribute('floating-origin-sync', '');

document.getElementById('tap-button').addEventListener('click', async () => {
  document.getElementById('tap-overlay').style.display = 'none';

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const permission = await DeviceOrientationEvent.requestPermission();
      log('ORIENTATION', 'permission result', permission);
    } catch (err) {
      console.error('[ORIENTATION] permission error:', err);
    }
  }

  statusEl.textContent = 'Firestoreから座標を取得中...';
  target = await fetchTargetLocationFromFirebase();
  log('FIRESTORE', 'target fetched', target);

  if (isNaN(target.lat) || isNaN(target.lng)) {
    statusEl.textContent = '座標を取得できませんでした(URLの?id=を確認してください)';
    return;
  }

  tryCreateReference();
});
</script>
</body>
</html>
