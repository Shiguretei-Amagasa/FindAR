<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS AR 最小テスト</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

<a-scene
  vr-mode-ui="enabled: false"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="antialias: true; alpha: true;"
>
  <a-camera gps-new-camera="gpsMinDistance: 5;"></a-camera>
</a-scene>

<script>
  // AR.js公式パターン：カメラが実際のGPS位置を初めて取得した瞬間に、
  // その位置から北へ約11m(緯度0.0001度)ずらした場所に赤い箱を1個だけ置く
  window.addEventListener('DOMContentLoaded', () => {
    const cameraEl = document.querySelector('[gps-new-camera]');
    let placed = false;

    cameraEl.addEventListener('gps-camera-update-position', (e) => {
      console.log('[TEST] GPS取得:', e.detail.position.latitude, e.detail.position.longitude);
      if (placed) return;
      placed = true;

      const box = document.createElement('a-box');
      box.setAttribute('color', 'red');
      box.setAttribute('scale', '10 10 10');
      box.setAttribute('gps-new-entity-place', `latitude: ${e.detail.position.latitude + 0.0001}; longitude: ${e.detail.position.longitude};`);
      document.querySelector('a-scene').appendChild(box);

      console.log('[TEST] 赤い箱を配置しました(自分の北側 約11m)');
    });
  });
</script>
</body>
</html>
